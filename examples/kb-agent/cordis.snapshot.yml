# Keyless knowledge-base snapshots: the ACP base tree with the DeepSeek
# adapter disabled, the replay adapter in, and the kb rows inserted — all in
# one include, because patches cannot target entries behind a nested include.
# The acp-agent config patch replaces the whole app config, so the base fields
# are restated verbatim and the model re-pins to `deepseek-v4-pro`, the live
# composition's shipped default, so replay holds the recorded model.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../acp-agent/cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-pro
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: spill-local
            name: '@deepseek-ai/dsh-spill-local'
            config:
              root: !!js process.env.DSH_SNAPSHOT_SPILL_ROOT ?? './.spill'
          - id: spill-policy
            name: '@deepseek-ai/dsh-spill-policy'
            config:
              maxInlineBytes: 800
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
          - id: kb
            name: '@deepseek-ai/dsh-host-kb'
            config:
              trashRetentionDays: 0
          - id: kb-tools
            name: '@deepseek-ai/dsh-tool-kb'
